name: Assign passing PR for review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged workflow uses only GitHub metadata and never checks out PR code.
      - name: Assign current passing pull request
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          OWNER = "kurtisyana-slowzone-avit"

          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(
                  os.environ["GITHUB_API_URL"] + path,
                  data=data,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req, timeout=20) as response:
                  return json.load(response)

          def handoff(run, repo, call=api):
              if (run["event"], run["status"], run["conclusion"]) != ("pull_request", "completed", "success"):
                  return
              source = run.get("head_repository") or {}
              branch = run.get("head_branch")
              sha = run.get("head_sha")
              if not (source.get("id") and branch and sha):
                  return
              query = urlencode({"state": "open", "head": f"{source['owner']['login']}:{branch}", "per_page": 100})
              linked = {entry["number"] for entry in run.get("pull_requests", [])}
              prefix_matches = []
              for page in range(1, 101):
                  rows = call(f"/repos/{repo}/pulls?{query}&page={page}")
                  for pr in rows:
                      head = pr["head"]
                      if (head["sha"] == sha and head["ref"] == branch
                              and (head.get("repo") or {}).get("id") == source["id"]
                              and (not linked or pr["number"] in linked)):
                          prefix_matches.append(pr["number"])
                  if len(rows) < 100:
                      break
              else:
                  raise RuntimeError("Could not exhaust matching pull requests")
              if not linked and len(prefix_matches) > 1:
                  raise RuntimeError("CI omitted the pull request association and the source branch matches multiple PRs")
              for number in prefix_matches:
                  pr = call(f"/repos/{repo}/pulls/{number}")
                  if (pr["state"] != "open" or pr["head"]["sha"] != sha
                          or pr["commits"] < 1 or any(user["login"] == OWNER for user in pr["assignees"])):
                      continue
                  updated = call(f"/repos/{repo}/issues/{number}/assignees", {"assignees": [OWNER]})
                  if not any(user["login"] == OWNER for user in updated["assignees"]):
                      raise RuntimeError(f"GitHub did not assign PR #{number} to {OWNER}")
                  print(f"Assigned PR #{number} at {sha} to {OWNER} for manual review and merge.")

          if __name__ == "__main__":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)
              handoff(event["workflow_run"], os.environ["GITHUB_REPOSITORY"])
